name: Release

# Publishes the @shortwind/* packages to npm via OIDC trusted publishing — no
# long-lived NPM_TOKEN secret. Push a tag like `v0.1.0-beta.3` (matching the
# version in the package.json files) and this runs; or dispatch it manually to
# publish whatever versions are currently committed.
#
# One-time npm setup is required before the first run — see RELEASING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm (trusted publishing)
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          # Pins the registry so the OIDC exchange targets npmjs.org. No token is
          # written — trusted publishing authenticates via the id-token above.
          registry-url: https://registry.npmjs.org

      # Trusted publishing + provenance attestation require npm >= 11.5.1; node 22
      # ships npm 10.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # Don't ship a broken release: gate publish on the same checks as CI.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # On a tag push, the tag must match the version actually in the tree, or we
      # would publish a surprise version. (Skipped for manual dispatch.)
      - name: Guard tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${pkg}"
            exit 1
          fi
          echo "Releasing ${pkg}"

      # pnpm pack rewrites workspace:* deps to concrete versions inside each
      # tarball. We pack in dependency order so a tarball is never built against
      # an unbuilt dep (build already ran above, but order keeps it obvious).
      - name: Pack publishable packages
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tarballs"
          mkdir -p "$out"
          for dir in core runtime tailwind registry vite next astro cli; do
            echo "::group::pack @shortwind/${dir}"
            ( cd "packages/${dir}" && pnpm pack --pack-destination "$out" )
            echo "::endgroup::"
          done
          ls -la "$out"

      # npm is the reference trusted-publishing implementation; publishing the
      # pnpm-packed tarballs keeps workspace resolution with pnpm and auth/OIDC
      # with npm. Notes:
      #   - publishConfig.tag is NOT honored when publishing a tarball, so the
      #     dist-tag is read from each package.json and passed with --tag (else
      #     npm defaults prereleases to `latest`).
      #   - already-published versions are skipped (not fatal), so a partial
      #     release can be re-run to completion and bootstrap-published packages
      #     don't abort the job.
      - name: Publish to npm (OIDC + provenance)
        run: |
          set -euo pipefail
          for tgz in "$RUNNER_TEMP/tarballs"/*.tgz; do
            pkg="$(tar -xzO -f "$tgz" package/package.json)"
            name="$(node -p 'JSON.parse(process.argv[1]).name' "$pkg")"
            version="$(node -p 'JSON.parse(process.argv[1]).version' "$pkg")"
            tag="$(node -p 'JSON.parse(process.argv[1]).publishConfig?.tag || "latest"' "$pkg")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::notice::${name}@${version} already published — skipping"
              continue
            fi
            echo "::group::publish ${name}@${version} (tag: ${tag})"
            npm publish "$tgz" --provenance --access public --tag "$tag"
            echo "::endgroup::"
          done
