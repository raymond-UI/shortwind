name: CI

on:
  push:
    branches: [main]
  pull_request:

# socket.dev integration is deliberately deferred — tracked in SECURITY.md.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Security policy checks
    runs-on: ubuntu-latest
    # checkout needs contents:read; an empty map ({}) starves the GITHUB_TOKEN
    # and the clone 404s on private repos. This is the minimal grant per job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (fail on high/critical, including devDependencies)
        run: pnpm audit --audit-level=high
      - name: Exact-pin policy (@tanstack/react-router, @tanstack/react-start)
        run: pnpm check:pins
      - name: Release-age policy (pnpm.minimumReleaseAge ≥ 72h)
        run: pnpm check:release-age
      - name: Dependency-direction policy (layered arrows)
        run: pnpm check:deps
      - name: Policy script tests
        run: pnpm test:scripts

  build:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    # checkout needs contents:read; an empty map ({}) starves the GITHUB_TOKEN
    # and the clone 404s on private repos. This is the minimal grant per job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The catalog build rewrites packages/registry/catalog.lock.json (the
      # version ledger that machine-checks "content changed → version bumped").
      # A clean build leaves it byte-identical; any drift means an uncommitted
      # version bump OR a deleted lock entry that the build silently
      # re-bootstrapped (the version-enforcement bypass). Fail loudly.
      - name: Catalog version-lock is committed and unchanged
        run: git diff --exit-code -- packages/registry/catalog.lock.json
      # The committed CDN bundle (site/public/expand.js, served at
      # shortwind.dev/expand.js) is a build artifact that can silently go stale
      # when the runtime changes — the site deploy only triggers on site/**, so
      # a runtime-only change would never refresh it. `pnpm build` just rebuilt
      # the canonical artifact; fail if the committed copy doesn't match.
      - name: Committed CDN bundle is in sync with the runtime
        run: |
          cmp packages/registry/dist/expand.js site/public/expand.js || {
            echo "::error::site/public/expand.js is stale — run 'pnpm tsx scripts/sync-runtime-to-site.ts' and commit the result"
            exit 1
          }
      # Print the measured token savings into the build log. The floor that
      # backs the README claim is asserted by the bench test in `pnpm test`;
      # this step surfaces the actual table for each run.
      - name: Token benchmark (corpus)
        run: node packages/cli/dist/bin.js bench --corpus

  verify-recipes:
    name: Verify recipe lockfile (if present)
    runs-on: ubuntu-latest
    # checkout needs contents:read; an empty map ({}) starves the GITHUB_TOKEN
    # and the clone 404s on private repos. This is the minimal grant per job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: shortwind verify
        run: |
          if [ -f recipes/.shortwind-lock.json ]; then
            pnpm --filter shortwind exec shortwind verify
          else
            echo "No recipes/.shortwind-lock.json — skipping verify."
          fi
