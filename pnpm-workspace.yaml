packages:
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Force the patched devalue: astro pulls 5.8.0, which carries a high-severity
# DoS advisory (GHSA-77vg-94rm-hx3p). 5.8.1 is the patch and is a semver-
# compatible bump. Drop this once astro ships a release that pins >=5.8.1.
#
# Force the patched postcss: next pulls 8.4.31, which has a moderate XSS
# advisory (GHSA-qx2v-qp2m-jg93 — unescaped </style> in stringify output).
# >=8.5.10 is the patch and a semver-compatible bump. Drop once next pins it.
#
# Force the patched esbuild: the vite/vitest/tsx dev toolchain pulls 0.27.x,
# which carries a high-severity dev-server advisory (GHSA-gv7w-rqvm-qjhr — the
# dev server answers any origin). >=0.28.1 is the patch. It's a dev dependency
# only (not in any shipped package). 0.28.1 is newer than the 72h release-age
# window, so esbuild is added to minimumReleaseAgeExclude below to take the
# security patch immediately. Drop both once vite/vitest pin >=0.28.1.
overrides:
  devalue: ">=5.8.1"
  postcss: ">=8.5.10"
  esbuild: ">=0.28.1"
minimumReleaseAgeExclude:
  - esbuild
