# CLOUD-02 Phase-0 spike stub. NOT the production Worker config.
#
# This exists only so `expand-edge.ts` is a deployable Worker entrypoint and so
# the @cloudflare/vitest-pool-workers runtime can boot workerd against the same
# settings. The production Worker (serve path) is wired in a later wave and does
# NOT expand — expansion happens server-side at publish via the Convex action
# (CLOUD-20).
#
# Hypothesis under test: @shortwind/core needs NO Node built-ins, so this config
# carries NO `compatibility_flags = ["nodejs_compat"]`. If the spike test fails
# to boot/run without it, add the flag here and in worker/vitest.config.ts and
# record that in SPIKE.md. Outcome: see worker/SPIKE.md.
name = "shortwind-cloud-expand-spike"
main = "src/expand-edge.ts"
compatibility_date = "2025-06-01"

# --- CLOUD-21: serve-path storage bindings ----------------------------------
# These declare the R2 bucket + KV namespace the hot path (CLOUD-22 router) and
# the publish/delete mutations bind. Under @cloudflare/vitest-pool-workers /
# miniflare these resolve to LOCAL in-memory stores — no live Cloudflare creds.
#
# CLOUD-30 wires the LIVE resources: replace `bucket_name` with the real R2
# bucket and fill `id` with the real KV namespace id (and add `preview_id`).
# Leave these as placeholders until then.

[[r2_buckets]]
binding = "ARTIFACTS"                      # env.ARTIFACTS — frozen HTML artifacts
bucket_name = "shortwind-artifacts-local"  # CLOUD-30: real bucket name

[[kv_namespaces]]
binding = "ROUTES"              # env.ROUTES — hostname/path -> route hot cache
id = "shortwind-routes-local"   # CLOUD-30: real KV namespace id (+ preview_id)
