# Shortwind Cloud — API-proxy Worker.
#
# The platform's STABLE, BRANDED public API origin: `api.shortwind.dev`. It is a
# thin reverse proxy (src/proxy.ts) in front of the Convex HTTP-actions
# deployment, existing so the public origin — and therefore the OAuth `issuer`,
# the discovery doc, the REST catalog, and the CLI default — is a name WE own, not
# the immutable `*.convex.site` deployment slug. Re-pointing to a new Convex
# deployment is a one-line CONVEX_HTTP_URL change here; nothing downstream moves.
#
# It forwards ONLY the public prefixes (/v1, /oauth, /.well-known) and 404s the
# rest — the Worker-only /internal/* cold-source endpoints are never reachable
# from this origin (defense-in-depth atop SERVE_INTERNAL_SECRET; see src/proxy.ts).
name = "shortwind-cloud-api"
main = "src/proxy.ts"
compatibility_date = "2025-06-01"

[vars]
# The live Convex HTTP origin to forward to (PROD). This slug lives ONLY here —
# never in the shipped CLI nor any public contract. Swap it to migrate Convex
# deployments without a client release.
CONVEX_HTTP_URL = "https://prestigious-shrimp-154.convex.site"

# --- route (the branded origin) ---------------------------------------------
# ROUTE IS ATTACHED MANUALLY, NOT HERE — same reason as the serve Worker. CI
# authenticates with an ACCOUNT-OWNED API token (CF's recommended CI credential).
# Account-owned tokens are "Entire Account" scoped and expose NO zone-level
# permission groups (no "Workers Routes", no "Zone"), so wrangler can upload the
# script but CANNOT attach a route to the `shortwind.dev` zone. Declaring `routes`
# here would make `wrangler deploy` call the zone route API and fail with auth
# error 10000.
#
# Attach ONCE by hand (see DEPLOY.md), then leave it out so CI deploys never touch
# routes and the manual route persists:
#   1. DNS: shortwind.dev zone → add a proxied (orange-cloud) record for
#      `api` (AAAA `100::` or a CNAME to a Workers hostname) so the name resolves
#      to Cloudflare's edge.
#   2. Cloudflare dash → Workers & Pages → shortwind-cloud-api → Settings →
#      Domains & Routes → Add → Route → `api.shortwind.dev/*`, zone `shortwind.dev`.
#   (Or: a Custom Domain `api.shortwind.dev` on this Worker, which creates the DNS
#    record + route together.)
#
# routes = [
#   { pattern = "api.shortwind.dev/*", zone_name = "shortwind.dev" },
# ]
